name: Fuzz

# Property-based (Hypothesis) fuzzing of the NMEA parser plus a host-compiled
# unit test of the shared firmware command parser (vanchorParseCmd). Both are
# fast and hardware-free, so they run on every push / PR.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect docs-only changes so the fuzz + firmware jobs can skip them (a skipped
  # required job still reports its check = pass, so protection isn't deadlocked).
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect docs-only change
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          printf 'changed files:\n%s\n' "$files"
          docs_re='(^docs/|\.md$|^\.github/pull_request_template\.md$|^LICENSE$)'
          nondoc="$(printf '%s\n' "$files" | grep -vE "$docs_re" || true)"
          if [ -z "$files" ] || [ -z "$nondoc" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"          # docs-only change
          elif [ "$nondoc" = "pyproject.toml" ] && ! git diff "$base" "$head" -- pyproject.toml | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -qvE '^[+-]version *= *'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"          # release: version-only bump (+ docs)
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  nmea-fuzz:
    name: NMEA parser fuzz (Hypothesis)
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The dev extra carries pytest AND hypothesis (single source of truth in
        # pyproject), so the fuzz job has the test runner it needs.
        run: pip install -e ".[dev]"

      - name: Run NMEA fuzz tests
        run: python -m pytest tests/test_nmea_fuzz.py -q

  firmware-host-test:
    name: Firmware command-parser host test
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run vanchorParseCmd host test
        run: make -C firmware/steering/tests
