name: CI

# Feature branches are validated via the pull_request event only; push runs are
# restricted to main (post-merge) so a branch+PR doesn't double-run everything.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (a new push to a PR supersedes the old).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect a docs-only change so the heavy jobs can skip it. A skipped required
  # job still reports its check (as "skipped" = pass), so this does NOT deadlock
  # branch protection — unlike workflow-level paths filtering, which never creates
  # the check and would block the PR forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect docs-only change
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0   # can't diff -> run everything
          fi
          files="$(git diff --name-only "$base" "$head")"
          printf 'changed files:\n%s\n' "$files"
          # docs-only = every changed file is markdown / under docs/ / the PR template / LICENSE
          if [ -z "$files" ] || ! printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$|^\.github/pull_request_template\.md$|^LICENSE$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # NOTE: this is a MATRIX job, so its steps (not the job) are gated on the
  # docs-only skip. A skipped matrix job would report the unexpanded check name
  # "Test (Python ${{ matrix.python-version }})", leaving the required contexts
  # "Test (Python 3.11/3.12)" unreported and the PR blocked. Running the job with
  # its steps skipped expands the matrix and reports both names as success.
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ needs.changes.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: pip install -e . -r requirements-dev.txt

      - name: Run tests
        if: ${{ needs.changes.outputs.skip != 'true' }}
        run: python -m pytest -q

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e . -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests

  js-syntax:
    name: JS syntax
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          for f in src/vanchor/ui/static/*.js; do
            node --check "$f" || { echo "FAIL: $f"; exit 1; }
          done

  browser-e2e:
    name: Browser E2E
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e . -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Smoke test (e2e_smoke.py)
        run: python e2e_smoke.py

      - name: Playwright regression tests
        run: pytest -m e2e tests/test_e2e_playwright.py -q
