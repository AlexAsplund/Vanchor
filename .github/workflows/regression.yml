name: Regression

# Sim-based regression gates (roadmap #39): run a fixed set of key analysis
# scenarios and fail the build if their control-quality metrics (settling time,
# overshoot, station-keeping RMS, cross-track, ...) drift outside tolerance
# against the committed baseline in src/vanchor/analysis/baselines/regression.json.
#
# When an INTENDED control/sim change moves the numbers, regenerate the baseline
# locally and commit the diff:
#     python scripts/regression_check.py --update

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect docs-only changes so the gate can skip them (a skipped required job
  # still reports its check = pass, so branch protection isn't deadlocked).
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect docs-only change
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" "$head")"
          printf 'changed files:\n%s\n' "$files"
          docs_re='(^docs/|\.md$|^\.github/pull_request_template\.md$|^LICENSE$)'
          nondoc="$(printf '%s\n' "$files" | grep -vE "$docs_re" || true)"
          if [ -z "$files" ] || [ -z "$nondoc" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"          # docs-only change
          elif [ "$nondoc" = "pyproject.toml" ] && ! git diff "$base" "$head" -- pyproject.toml | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -qvE '^[+-]version *= *'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"          # release: version-only bump (+ docs)
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  regression:
    name: Sim regression gate
    needs: changes
    if: ${{ needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e . -r requirements-dev.txt

      - name: Run regression gate
        run: python scripts/regression_check.py --verbose

      - name: Self-test the gate + soak invariants
        run: pytest scripts/test_ci_regression.py -q
